apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # This is the Service name Prometheus gets from the kube-prometheus-stack
    # Helm chart in the "monitoring" namespace — adjust if you named the
    # Helm release something else.
    url: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
    isDefault: true
