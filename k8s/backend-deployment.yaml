apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fernway
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        # Tells Prometheus (via the annotation-based scrape config) to
        # find this pod automatically — no manual target list to maintain.
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          # Replace <ACCOUNT_ID> with your AWS account id (from the
          # Terraform ecr_backend_repo_url output). :latest is fine for
          # learning; Jenkins will later tag with the git commit SHA instead.
          image: <ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/fernway-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: fernway-config
            - secretRef:
                name: fernway-db-secret
          # Kubernetes only sends traffic here once this passes —
          # prevents a pod that's still starting up from receiving requests.
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          # If this fails repeatedly, Kubernetes kills and restarts the
          # pod automatically — this is the "self-healing" piece.
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
