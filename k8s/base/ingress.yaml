apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fernway-ingress
  namespace: fernway
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    # "ip" target type sends ALB traffic straight to pod IPs (via the VPC
    # CNI) instead of routing through the node's NodePort — the standard
    # choice for EKS.
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    # Uncomment once you have a domain + ACM certificate:
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:eu-west-1:064589995443:certificate/<CERT_ID>
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
spec:
  rules:
    - http:
        paths:
          # /api/* goes to the backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          # everything else goes to the frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
