apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fernway
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Placeholder name/tag on purpose — see the note in
          # backend-deployment.yaml. Overlays rewrite this per environment.
          image: fernway-frontend:local
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
