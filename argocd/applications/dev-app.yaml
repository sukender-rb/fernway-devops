apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fernway-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sukender-rb/fernway-devops.git
    targetRevision: dev
    path: k8s/overlays/dev
  destination:
    # Same cluster ArgoCD itself runs in — correct if ArgoCD lives in the
    # dev cluster. See argocd/README.md for staging/prod, which live on
    # separate clusters and need a real cluster server URL here instead.
    server: https://kubernetes.default.svc
    namespace: fernway
  syncPolicy:
    automated:
      # prune: removes resources from the cluster that got deleted from Git
      # selfHeal: reverts any manual kubectl change back to match Git —
      # this is the actual GitOps guarantee: Git is the only source of truth.
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # Known ArgoCD + HPA conflict: backend-hpa actively changes replica count
  # based on load, but the Deployment manifest in Git also specifies a
  # fixed replica count. Without this, ArgoCD's selfHeal fights the HPA
  # every reconcile loop (OutOfSync -> Synced -> OutOfSync, forever).
  # This tells ArgoCD "the HPA owns this field, don't touch it."
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers:
        - /spec/replicas
