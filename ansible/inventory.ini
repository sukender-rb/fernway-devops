# Ansible is used here for the few things Terraform/Kubernetes don't
# cover directly — bootstrapping any plain EC2 boxes you run outside
# the cluster (e.g. a self-hosted Jenkins server). It is NOT used to
# configure the EKS nodes themselves — those are managed by AWS.
#
# Fill in real IPs/hostnames after Terraform creates the relevant
# instance (e.g. a Jenkins EC2 host), or generate this file dynamically
# with the aws_ec2 inventory plugin instead of editing it by hand.

[jenkins]
# jenkins-server ansible_host=<EC2_PUBLIC_IP> ansible_user=ubuntu

[jenkins:vars]
ansible_ssh_private_key_file=~/.ssh/fernway-key.pem
