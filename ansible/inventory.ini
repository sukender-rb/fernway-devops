# Fill in the real IP after Terraform creates the Jenkins instance
# (see the jenkins_public_ip output). Amazon Linux's default SSH user
# is "ec2-user", not "ubuntu".

[jenkins]
jenkins-server ansible_host=108.128.246.200 ansible_user=ec2-user

[jenkins:vars]
ansible_ssh_private_key_file=~/.ssh/fernway-jenkins-key.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'