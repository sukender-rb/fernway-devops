---
# Amazon Linux 2023 uses dnf, not apt (this box is Amazon Linux, switched
# from the original Ubuntu plan — see jenkins-ec2.tf for why).

- name: Update all packages
  dnf:
    update_cache: true
    name: "*"
    state: latest

- name: Install base packages
  dnf:
    name:
      - docker
      - git
      - unzip
    state: present

- name: Ensure Docker is running and enabled
  systemd:
    name: docker
    state: started
    enabled: true

- name: Add the SSH user to the docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Enable dnf automatic security updates
  dnf:
    name: dnf-automatic
    state: present

- name: Configure dnf-automatic for security updates only, applied automatically
  ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
  loop:
    - { option: "apply_updates", value: "yes" }
    - { option: "upgrade_type", value: "security" }
  notify: enable dnf-automatic timer

- name: Disable password authentication over SSH
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
  notify: restart sshd